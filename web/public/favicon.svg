<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Patron's mark: the key inside the seal.
       Deliberately NOT the full logo. The wordmark, the dashed rings, the
       hairline accents and the soft glow all collapse into grey mush below
       about 32px, and a favicon spends its entire life at 16. So this keeps
       only what survives that size — the coin edge and the key — at stroke
       weights chosen to still read when the whole thing is the size of a word.
       The key is the right thing to keep: Patron can release money and
       structurally cannot take it back, which is the whole product. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5DC72"/>
      <stop offset="55%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7420"/>
    </linearGradient>
  </defs>

  <!-- Seal ground. A rounded square rather than a bare circle so the mark keeps
       a body when a browser or OS crops it into a shape of its own. -->
  <rect width="64" height="64" rx="15" fill="#0C1320"/>

  <!-- Coin edge -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#g)" stroke-width="2.6"/>

  <!-- Key bow. The ring itself reads as the keyhole — an inner keyhole shape
       would close up at small sizes and turn into a solid dot. -->
  <circle cx="32" cy="23.5" r="8.4" fill="none" stroke="url(#g)" stroke-width="4.2"/>

  <!-- Shaft -->
  <rect x="29.8" y="31" width="4.5" height="18.5" rx="1.6" fill="url(#g)"/>

  <!-- Teeth -->
  <rect x="34.3" y="37.4" width="7" height="3.4" rx="1.3" fill="url(#g)"/>
  <rect x="34.3" y="43.3" width="5.2" height="3.4" rx="1.3" fill="url(#g)"/>
</svg>
